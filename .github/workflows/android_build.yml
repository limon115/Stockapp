# Architected by Khalid Hasan Limon
name: GlassLog Enterprise Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile:
    name: Build Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Cloud Wrapper
        run: gradle wrapper

      - name: 🔐 Dynamically Forge local.properties with API Key
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Forge Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Grant Exec Permissions
        run: chmod +x gradlew || true

      - name: Assemble GlassLog APK
        run: ./gradlew assembleDebug --no-daemon
        
      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassLog-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
